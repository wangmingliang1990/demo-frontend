# 前端 CI：test → build-image → notify-product
# 结构和 demo-backend 的 ci.yml 完全一致（微服务流水线的"标准模板"）：
# 每个服务仓库都走 测试→出镜像→通知产品仓库 这三步
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests -v

  # 【新增】构建前端镜像推到 ghcr.io（tag = git sha，可追溯）
  build-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  # 【新增】通知产品仓库：frontend 有新镜像了，请更新清单并重新装配产品
  notify-product:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger product update
        env:
          # 和后端一样，需要在 demo-frontend 仓库的 Secrets 里添加 DISPATCH_TOKEN
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh api repos/${{ github.repository_owner }}/demo-product/dispatches \
            -f event_type=service-image-updated \
            -f "client_payload[service]=frontend" \
            -f "client_payload[tag]=${{ github.sha }}"
